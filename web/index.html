<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PathIO turns long URLs into compact, persistent short links — with total and unique clicks, day-by-day history, referrer domains, and device breakdowns for every link."
    />
    <title>PathIO — Shorten the link. Keep the story.</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PathIO" />
    <meta property="og:title" content="PathIO — Shorten the link. Keep the story." />
    <meta
      property="og:description"
      content="Turn long URLs into compact, persistent short links with built-in click analytics: total and unique clicks, history, referrer domains, and devices."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PathIO — Shorten the link. Keep the story." />
    <meta
      name="twitter:description"
      content="A URL shortener with built-in click analytics: total and unique clicks, history, referrer domains, and devices."
    />
    <script>
      // Apply the stored/system theme before first paint to avoid a flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('pathio-theme')
          var isDark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (isDark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* localStorage/matchMedia unavailable — fall back to light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
