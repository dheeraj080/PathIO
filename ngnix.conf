http {
    # Define a shared memory zone tracking IP addresses (10MB holds ~160k IPs)
    limit_req_zone $binary_remote_addr zone=read_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=5r/s;

    server {
        listen 80;

        # Read Redirect Path - Burst allowed up to 20 requests
        location / {
            limit_req zone=read_limit burst=20 nodelay;
            proxy_pass http://monolith_backend;
        }

        # Write Shorten Path - Strict limit
        location /api/v1/shorten {
            limit_req zone=write_limit burst=2;
            proxy_pass http://monolith_backend;
        }
    }
}