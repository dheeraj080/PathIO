services:
  postgres:
    image: postgres:16-alpine
    container_name: pathio-postgres
    environment:
      POSTGRES_DB: pathio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pathio-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: >
      redis-server 
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

volumes:
  pgdata:
  redisdata: