# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=pathio
server.port=8080
# Java 21 Virtual Threads Enabling for High Throughput Concurrent I/O
spring.threads.virtual.enabled=true
# ===================================================================
# PostgreSQL Configuration (Primary DB for URL Mappings & Segments)
# ===================================================================
spring.datasource.url=jdbc:postgresql://postgres:5432/urlshortener
spring.datasource.username=shortener
spring.datasource.password=shortener_pass
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP-Postgres
# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ===================================================================
# Secondary DataSource: ClickHouse (Analytics Time-Series DB)
# ===================================================================
clickhouse.datasource.url=jdbc:clickhouse://clickhouse:8123/default
clickhouse.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
clickhouse.datasource.username=default
clickhouse.datasource.password=clickhouse
# ===================================================================
# Redis Configuration (L2 Cache & Streams Analytics Buffer)
# ===================================================================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# Redis Lettuce Connection Pool Tuning
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=32
spring.data.redis.lettuce.pool.min-idle=8
# ===================================================================
# Key Generator & Obfuscation Tuning
# ===================================================================
app.keygen.secret-key=9876543210987654
app.keygen.segment-size=100000
# Cache Expirations
app.cache.l1.max-size=100000
app.cache.l1.ttl-minutes=10
app.cache.l2.ttl-hours=24
# Logging
logging.level.root=INFO
logging.level.com.shortener.monolith=INFO
# Cloudflare Edge Integration Settings
cloudflare.edge-secret-token=super-secure-edge-shared-secret-key-2026
# Base Domain for Shortened Links
app.base-url=http://localhost:8080

