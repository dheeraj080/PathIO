# ==============================================================================
# QUARKUS CORE & NETWORKING (Tuned for High Concurrency)
# ==============================================================================
quarkus.analytics.disabled=true

# Vert.x Non-Blocking Event Loops & Thread Pool
quarkus.vertx.event-loop-pool-size=16
quarkus.thread-pool.max-threads=500
quarkus.thread-pool.queue-size=10000

# Netty Socket Queue Backlog
quarkus.http.backlog=10000

# ==============================================================================
# IN-MEMORY CACHE (Caffeine)
# ==============================================================================
quarkus.cache.caffeine."urls".maximum-size=50000
quarkus.cache.caffeine."urls".expire-after-access=2H

# ==============================================================================
# APACHE CASSANDRA CLIENT (DataStax Java Driver)
# ==============================================================================
quarkus.cassandra.contact-points=127.0.0.1:9042
quarkus.cassandra.local-datacenter=datacenter1
quarkus.cassandra.keyspace=url_shortener

# Force connection pool creation on startup (eliminates 2.8s first-request delay)
quarkus.cassandra.init.eager-init=true

# Tuned for high throughput & sub-5ms latencies
quarkus.cassandra.basic.request.consistency=LOCAL_ONE
quarkus.cassandra.advanced.connection.pool.local.size=8

# ==============================================================================
# TELEMETRY & OPENTELEMETRY TRACING
# ==============================================================================
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=http://localhost:4317
quarkus.opentelemetry.tracer.suppress-non-application-uris=true

# ==============================================================================
# ASYNCHRONOUS STRUCTURED LOGGING
# ==============================================================================
quarkus.log.async=true
quarkus.log.async.queue-length=10000
quarkus.log.async.overflow=block

# JSON Console Output
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.level=INFO

# Suppress high-frequency framework logs during benchmarks
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."org.apache.cassandra".level=WARN
quarkus.log.category."com.datastax.oss".level=WARN

quarkus.datasource.devservices.enabled=false