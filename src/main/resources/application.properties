## Primary Database (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app_user
quarkus.datasource.password=app_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pathio_shortener

## Schema Generation
quarkus.hibernate-orm.database.generation=update

## Telemetry
quarkus.analytics.disabled=true

## Caffeine Cache
quarkus.cache.caffeine."urls".maximum-size=10000
quarkus.cache.caffeine."urls".expire-after-access=2H

# Cassandra Connection Settings
quarkus.cassandra.contact-points=127.0.0.1:9042
quarkus.cassandra.local-datacenter=datacenter1
quarkus.cassandra.keyspace=link_shortener

# Configure Consistency Levels for Throughput vs. Safety
quarkus.cassandra.request.basic.request.consistency=LOCAL_QUORUM

quarkus.cassandra.init.eager-init=true

quarkus.hibernate-orm.rest-data-panache.generate-for-all-entities=false

quarkus.vertx.event-loop-pool-size=16

quarkus.cassandra.advanced.connection.pool.local.size=8

# Increase TCP backlog queue size for incoming connections
quarkus.http.backlog=10000

# Increase maximum IO threads and worker pool
quarkus.thread-pool.max-threads=500
quarkus.thread-pool.queue-size=10000