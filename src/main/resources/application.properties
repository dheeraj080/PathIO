spring.application.name=pathio

# Enable Virtual Threads for web request execution (Spring Boot 3.2+ / Java 21+)
spring.threads.virtual.enabled=true

# Database Connection (Externalized with Environment Variable Fallbacks)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pathio_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP High-Throughput Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Safety Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# JWT Security Configuration
# security.jwt.secret is REQUIRED for non-dev startup (no default value). Startup fails if it is
# missing, blank, shorter than 64 characters, or equal to a known insecure placeholder.
# Generate with `openssl rand -base64 48`. Development-only fallback: spring.profiles.active=dev
# + security.jwt.dev-fallback=true.
security.jwt.secret=${JWT_SECRET:}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}
security.jwt.issuer=${JWT_ISSUER:pathio}

# URL Shortener Configuration
app.shortener.domain=${APP_SHORTENER_DOMAIN:https://path.io/}
app.shortener.service-host=${APP_SHORTENER_SERVICE_HOST:path.io}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# OAuth2 Provider Registrations
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}

# Spring Boot Actuator & Metrics Exposure
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.endpoint.prometheus.enabled=true

# Tag every metric with the application name (matches the Prometheus scrape labels)
management.metrics.tags.application=pathio

# Distributed Tracing Configuration (OpenTelemetry + Micrometer)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Structured Logback Pattern with MDC Trace Correlation
logging.pattern.level=%5p [${spring.application.name:pathio},%X{traceId:-},%X{spanId:-}]
logging.level.org.hibernate.SQL=WARN
logging.level.com.pt.pathio=INFO