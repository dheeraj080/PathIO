# Primary PostgreSQL Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app_user
quarkus.datasource.password=app_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pathio_shortener

# Database Schema Strategy
# In dev mode, 'update' or 'none' is preferred over 'drop-and-create' to preserve data
quarkus.hibernate-orm.database.generation=update

# Disable Quarkus telemetry/analytics reporting (fixed property name)
quarkus.analytics.disabled=true