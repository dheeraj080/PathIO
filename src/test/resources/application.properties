# Disable DevServices (prevents auto-launching Docker containers)
quarkus.devservices.enabled=false

# Force In-Memory H2 for tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-generation.database.generation=drop-and-create

# Disable Caching during tests for predictability
quarkus.cache.enabled=false

# Disable DevServices for Redis and Kafka specifically if included in pom.xml
quarkus.redis.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

