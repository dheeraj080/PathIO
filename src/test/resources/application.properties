# ===================================================================
# Global DevServices & Test Port Management
# ===================================================================
# Disable ALL automatic Docker/Testcontainers triggers
quarkus.devservices.enabled=false

# Allocate a dynamic, available port for REST-Assured during tests
quarkus.http.test-port=0

# Disable caching for test predictability
quarkus.cache.enabled=false


# ===================================================================
# Cassandra Database Configuration (Local 5.0 Node)
# ===================================================================
quarkus.cassandra.contact-points=127.0.0.1:9042
quarkus.cassandra.local-datacenter=datacenter1
quarkus.cassandra.keyspace=url_shortener

# Suppress Vert.x non-blocking thread initialization warnings
quarkus.cassandra.init.eager-init=true


# ===================================================================
# Disable Relational ORM (If Hibernate/H2 are still in pom.xml)
# ===================================================================
quarkus.hibernate-orm.active=false
quarkus.flyway.active=false