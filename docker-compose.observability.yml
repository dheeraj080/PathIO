services:
  # Jaeger: Distributed tracing backend and visualization UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pathio-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Prometheus: Metrics scraper and time-series database
  prometheus:
    image: prom/prometheus:latest
    container_name: pathio-prometheus
    ports:
      - "9090:9090" # Prometheus Web UI
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana: Metrics and tracing dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: pathio-grafana
    ports:
      - "3000:3000" # Grafana Web UI (default login: admin/admin)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

volumes:
  grafanadata:
